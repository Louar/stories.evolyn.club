# Manual import: create general-taxonomy and food-taxonomy first. Demo cards create independent dependencies automatically.

slug: world-food-expedition
name:
  en: World Food Expedition
  nl: Wereldvoedselexpeditie
isPublished: false
isPublic: true
defaultBackgroundColor: '#101b2b'
configuration: null
videos: []
