announcements:
  - id: technique-intro
    name: Start with control
    title:
      en: Small steps, steady movement
      nl: Kleine stappen, rustig bewegen
    message:
      en: Watch these short examples. Choose a comfortable pace and controlled movements; stop if anything hurts.
      nl: Bekijk deze korte voorbeelden. Kies een prettig tempo en beheerste bewegingen; stop als iets pijn doet.
  - id: stretching-summary
    name: Finish gently
    title:
      en: Finish gently
      nl: Sluit rustig af
    message:
      en: Choose control over speed. Breathe calmly and stretch only within a comfortable range. Lesson complete!
      nl: Kies controle boven snelheid. Adem rustig en rek alleen binnen een prettig bereik. Les afgerond!
quizzes:
  - id: pace-quiz
    name: Choose your pace
    doRandomize: false
    questions:
      - id: pace-question
        order: 1
        answerTemplateSlug: select-single
        title:
          en: How should you choose your workout pace?
          nl: Hoe kies je je trainingstempo?
        instruction:
          en: 'Hint: stay comfortable and in control. An incorrect answer replays this clip.'
          nl: 'Tip: blijf comfortabel en houd controle. Een fout antwoord herhaalt dit fragment.'
        isRequired: true
        answerGroup:
          id: pace-answers
          doRandomize: false
        answerOptions:
          - id: pace-comfortable
            order: 1
            value: comfortable
            label:
              en: A comfortable pace I can control
              nl: Een prettig tempo dat ik kan beheersen
          - id: pace-fastest
            order: 2
            value: fastest
            label:
              en: As fast as possible, even if it hurts
              nl: Zo snel mogelijk, ook als het pijn doet
  - id: control-quiz
    name: Move with control
    doRandomize: false
    questions:
      - id: control-question
        order: 1
        answerTemplateSlug: select-single
        title:
          en: What matters more than matching the instructor's speed?
          nl: Wat is belangrijker dan het tempo van de trainer volgen?
        instruction:
          en: 'Hint: choose control over speed. An incorrect answer replays this clip.'
          nl: 'Tip: kies controle boven snelheid. Een fout antwoord herhaalt dit fragment.'
        isRequired: true
        answerGroup:
          id: control-answers
          doRandomize: false
        answerOptions:
          - id: control-rushing
            order: 1
            value: rushing
            label:
              en: Rushing through every repetition
              nl: Elke herhaling afraffelen
          - id: control-steady
            order: 2
            value: steady
            label:
              en: Steady, controlled movements
              nl: Rustige, beheerste bewegingen
