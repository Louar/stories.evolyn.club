announcements:
  - id: welcome
    name: Rowan makes contact
    title:
      en: 'ROWAN / 12% battery'
      nl: 'ROWAN / 12% batterij'
    message:
      en: >-
        Hello? The trail app says you're my emergency contact. Excellent. We've skipped the awkward introductions.
        I'm Rowan. Alone in Blackpine Forest, ankle swollen, bridge washed out behind me.
        My emergency call dropped, but these messages go through. Please stay. It's getting dark.
      nl: >-
        Hallo? Volgens de wandelapp ben jij mijn noodcontact. Mooi. Slaan we het ongemakkelijke voorstellen over.
        Ik ben Rowan. Alleen in het Zwartdennenbos, dikke enkel, brug achter me weggespoeld.
        Mijn noodoproep viel weg, maar deze berichten komen door. Blijf alsjeblieft. Het wordt donker.
  - id: road-busy
    name: Rowan follows the service road
    title:
      en: Rowan is busy / walking
      nl: Rowan is bezig / onderweg
    message:
      en: 'Taking the service road. One careful step at a time. My ankle has filed a formal complaint.'
      nl: 'Ik neem de dienstweg. Voorzichtig, stap voor stap. Mijn enkel heeft officieel bezwaar ingediend.'
  - id: ridge-busy
    name: Rowan attempts the ridge
    title:
      en: Rowan is busy / climbing
      nl: Rowan is bezig / klimmen
    message:
      en: 'Trying the ridge. Rain in my eyes. The trail just slid under my bad foot. Wait. Where is the marker?'
      nl: 'Ik probeer de kam. Regen in mijn ogen. Het pad gleed net onder mijn slechte voet weg. Wacht. Waar is de markering?'
  - id: call-busy
    name: Rowan contacts rescue
    title:
      en: Rowan is busy / calling for help
      nl: Rowan is bezig / hulp bellen
    message:
      en: 'Calling again from the doorway. Reading them the pump-house number. Please let someone pick up.'
      nl: 'Ik bel opnieuw vanuit de deuropening. Ik lees het nummer van het pomphuis voor. Neem alsjeblieft op.'
  - id: rescue-busy
    name: Rowan waits for the team
    title:
      en: Rowan is busy / signalling
      nl: Rowan is bezig / signaleren
    message:
      en: 'Staying put. Whistle, listen, repeat. Someone just whistled back. Please be a person, not a very talented owl.'
      nl: 'Ik blijf hier. Fluiten, luisteren, herhalen. Er fluit iemand terug. Hopelijk een mens, geen bijzonder getalenteerde uil.'
  - id: lost
    name: The connection is lost
    title:
      en: 'ROWAN / message interrupted'
      nl: 'ROWAN / bericht onderbroken'
    message:
      en: >-
        I shouldn't have left the marked route. Can't find my way back in this rain.
        My ankle won't hold. Phone hit the water when I fell. If this sends, I'm near the...
        [No further messages. Rowan's location is unknown.]
      nl: >-
        Ik had de gemarkeerde route niet moeten verlaten. Ik vind de weg terug niet in deze regen.
        Mijn enkel houdt het niet. Telefoon viel in het water toen ik viel. Als dit aankomt, ik ben bij de...
        [Geen nieuwe berichten. Rowans locatie is onbekend.]
  - id: goodbye
    name: End this attempt
    title:
      en: Connection closed
      nl: Verbinding gesloten
    message:
      en: 'This attempt ends here. Rowan was not located before the connection failed. No rescue is confirmed.'
      nl: 'Deze poging eindigt hier. Rowan was nog niet gevonden toen de verbinding wegviel. Er is geen redding bevestigd.'
  - id: rescued
    name: Rowan is rescued
    title:
      en: 'ROWAN / borrowing a phone'
      nl: 'ROWAN / geleende telefoon'
    message:
      en: >-
        They found the pump house. Found me. I'm in the rescue van, wrapped in enough foil to qualify as a baked potato.
        You kept me somewhere they could find. Thank you for staying.
        When my ankle works again: a walk? Somewhere dangerous. Like a bakery.
      nl: >-
        Ze vonden het pomphuis. En mij. Ik zit in de reddingswagen, in genoeg folie om door te gaan voor een gepofte aardappel.
        Dankzij jou bleef ik op een plek waar ze me konden vinden. Bedankt dat je bleef.
        Als mijn enkel weer werkt: wandelen? Ergens gevaarlijks. Een bakkerij of zo.
quizzes:
  - id: route
    name: Choose a route
    doRandomize: false
    questions:
      - id: route-question
        order: 1
        answerTemplateSlug: select-single
        title:
          en: 'ROWAN: Sign says pump house along the service road. Ridge might have better reception. Thunder up there. Your call?'
          nl: 'ROWAN: Bord wijst naar een pomphuis langs de dienstweg. Op de kam misschien beter bereik. Wel onweer. Wat denk jij?'
        instruction:
          en: 'Fictional chat: busy scenes are compressed into a few seconds. Take your time choosing a reply.'
          nl: 'Fictieve chat: bezige momenten duren hier maar een paar seconden. Neem de tijd voor je antwoord.'
        isRequired: true
        answerGroup:
          doRandomize: false
        answerOptions:
          - id: service-road-answer
            order: 1
            value: service-road
            label:
              en: Take the marked service road. Give that ankle a chance.
              nl: Neem de gemarkeerde dienstweg. Spaar die enkel.
          - id: ridge-answer
            order: 2
            value: ridge
            label:
              en: Try the ridge. We need a stronger signal.
              nl: Probeer de kam. We hebben beter bereik nodig.
  - id: shelter-plan
    name: Use the landmark
    doRandomize: false
    questions:
      - id: shelter-question
        order: 1
        answerTemplateSlug: select-single
        title:
          en: 'ROWAN: Made it. Brick pump house, sign P-17, dry doorway. Five-star accommodation if you like spiders. Call again, or look for the road beyond the trees?'
          nl: 'ROWAN: Ik ben er. Bakstenen pomphuis, bord P-17, droge deuropening. Vijf sterren als je van spinnen houdt. Weer bellen, of achter de bomen naar de weg zoeken?'
        isRequired: true
        answerGroup:
          doRandomize: false
        answerOptions:
          - id: call-answer
            order: 1
            value: call
            label:
              en: Call emergency services. Tell them P-17 and stay there.
              nl: Bel de hulpdiensten. Geef P-17 door en blijf daar.
          - id: search-answer
            order: 2
            value: search
            label:
              en: Look for the road. You might flag down a car.
              nl: Zoek de weg. Misschien kun je een auto aanhouden.
  - id: signal-plan
    name: Help rescuers find Rowan
    doRandomize: false
    questions:
      - id: signal-question
        order: 1
        answerTemplateSlug: select-single
        title:
          en: 'ROWAN: They answered! Team coming to P-17. Told me to stay. Now there are lights beyond the trees, moving away. I have a whistle. Follow them or make some noise?'
          nl: 'ROWAN: Ze namen op! Er komt een team naar P-17. Ik moet hier blijven. Nu zie ik licht achter de bomen, het gaat verder weg. Ik heb een fluitje. Eropaf of geluid maken?'
        isRequired: true
        answerGroup:
          doRandomize: false
        answerOptions:
          - id: follow-answer
            order: 1
            value: follow
            label:
              en: Follow the lights before you lose them.
              nl: Volg het licht voordat het verdwijnt.
          - id: whistle-answer
            order: 2
            value: whistle
            label:
              en: Stay at P-17. Use the whistle to bring them to you.
              nl: Blijf bij P-17. Laat ze met je fluitje naar jou komen.
  - id: retry
    name: Rewind the story
    doRandomize: false
    questions:
      - id: retry-question
        order: 1
        answerTemplateSlug: select-single
        title:
          en: 'The chat has gone silent. Rewind this fictional story to Rowan at the junction, before any route was chosen?'
          nl: 'De chat is stilgevallen. Dit fictieve verhaal terugspoelen naar Rowan bij de splitsing, voordat je een route koos?'
        isRequired: true
        answerGroup:
          doRandomize: false
        answerOptions:
          - id: rewind-answer
            order: 1
            value: rewind
            label:
              en: Rewind to the junction. Let's choose differently.
              nl: Terug naar de splitsing. We kiezen anders.
          - id: end-answer
            order: 2
            value: end
            label:
              en: End this attempt here.
              nl: Stop deze poging hier.
