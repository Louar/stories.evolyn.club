announcements:
- id: welcome
  name: Farm origin intro
  title:
    en: Where did your meal begin?
    nl: Waar begon jouw maaltijd?
  message:
    en: <p>You will see ingredients from a hamburger and other familiar dishes. Pin each ingredient to the type
      of farm that is its main agricultural source.</p>
    nl: <p>Je ziet ingrediënten uit een hamburger en andere bekende gerechten. Pin elk ingrediënt op het type boerderij
      dat de belangrijkste agrarische herkomst is.</p>
- id: success
  name: Strong result
  title:
    en: From farm to fork — nicely traced
    nl: Van boer tot bord — goed herleid
  message:
    en: <p>You connected most ingredients to the right farm type.</p>
    nl: <p>Je koppelde de meeste ingrediënten aan het juiste type boerderij.</p>
- id: close
  name: Close result
  title:
    en: You are getting there
    nl: Je bent goed op weg
  message:
    en: <p>You recognized many origins. A few processed ingredients make the route less obvious.</p>
    nl: <p>Je herkende veel herkomsten. Bij een paar verwerkte ingrediënten is de route minder duidelijk.</p>
- id: practice
  name: Practice result
  title:
    en: Food has a longer journey than it looks
    nl: Eten legt een langere weg af dan je denkt
  message:
    en: <p>Some ingredients hide their agricultural origin. Try noticing the crop or animal behind the product.</p>
    nl: <p>Sommige ingrediënten verbergen hun agrarische herkomst. Kijk eens naar het gewas of dier achter het product.</p>
