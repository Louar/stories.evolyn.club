announcements:
- id: welcome
  name: Welcome
  title:
    en: From animal to cut
    nl: Van dier naar vleesdeel
  message:
    en: <p>You will play in two phases. First, match each meat to the right animal. Then, take on the butcher-chart challenge and click the correct cut.</p>
    nl: <p>Je speelt in twee rondes. Koppel eerst elk stuk vlees aan het juiste dier. Ga daarna de slagerskaart-uitdaging aan en klik op het juiste vleesdeel.</p>
- id: phase-two
  name: Phase two
  title:
    en: 'Round two: the butcher chart'
    nl: 'Ronde twee: de slagerskaart'
  message:
    en: '<p>Use the animal silhouettes and unlabelled sections to choose each cut.</p><p>This is an educational schematic, not a precise butchery guide. Regions are simplified and separated for learning; real cuts can overlap and vary by tradition.</p>'
    nl: '<p>Gebruik de diercontouren en de vakken zonder labels om elk vleesdeel te kiezen.</p><p>Dit is een educatief schema, geen nauwkeurige slagershandleiding. Gebieden zijn vereenvoudigd en gescheiden om te oefenen; echte vleesdelen kunnen overlappen en verschillen per traditie.</p>'
- id: success
  name: Excellent result
  title:
    en: Sharp eye for meat cuts
    nl: Scherp oog voor vleesdelen
  message:
    en: <p>You recognized both the animals and the cuts behind most meat types.</p>
    nl: <p>Je herkende bij de meeste vleessoorten zowel het dier als het juiste vleesdeel.</p>
- id: good
  name: Good result
  title:
    en: You know quite a lot already
    nl: Je weet al behoorlijk veel
  message:
    en: <p>You matched many meat types correctly. The exact cuts are the trickiest part.</p>
    nl: <p>Je koppelde veel vleessoorten goed. Vooral de precieze vleesdelen zijn het lastigst.</p>
- id: practice
  name: Practice result
  title:
    en: Time for another round
    nl: Tijd voor nog een ronde
  message:
    en: <p>You probably know the meats from the shop, but butcher-chart knowledge takes practice.</p>
    nl: <p>Je kent de vleessoorten waarschijnlijk uit de winkel, maar kennis van slagersdelen vraagt oefening.</p>
