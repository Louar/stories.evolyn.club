      nl: Geometrie en kaartmetadata om dit item te visualiseren
    type: custom
    referencedCategoryId: null
    schema:
      oneOf:
        - type: object
          required:
            - ref
          properties:
            ref:
              type: string
              minLength: 1
          additionalProperties: false
        - type: object
          required:
            - geometry
          properties:
            geometry:
              type: object
              required:
                - type
                - coordinates
              properties:
                type:
                  enum:
                    - Polygon
                    - MultiPolygon
                coordinates:
                  type: array
                  minItems: 1
              additionalProperties: false
          additionalProperties: false
