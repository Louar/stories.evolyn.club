slug: countries-and-foods
name:
  en: Countries and foods
  nl: Landen en voeding
description:
  en: Demo taxonomy with countries and foods
  nl: Demotaxonomie met landen en voedingsmiddelen
categories:
  - id: category-1
    name:
      en: Countries
      nl: Landen
    image: null
    description:
      en: Countries and territories from the map dataset
      nl: Landen en gebieden uit de kaartdataset
    map:
      version: 2
      source:
        collection: externals
        filename: /taxonomy-maps/countries-and-foods.04b5a002.json
      scene: countries
      showLabels: false
      minTargetDiameter: 24
  - id: category-2
    name:
      en: Foods
      nl: Voedsel
    image: null
    description:
      en: Everyday foods with nutrition values per 100 g
      nl: Dagelijks voedsel met voedingswaarden per 100 g
    map: null
attributes:
  - id: attribute-1
    slug: name
    question:
      en: Where is this country?
      nl: Waar ligt dit land?
    name:
      en: Name
      nl: Naam
    image: null
    description:
      en: Name
      nl: Naam
    type: translatable_category
    referencedCategoryId: null
    schema: null
  - id: attribute-2
    slug: emoji
    name:
      en: Emoji
      nl: Emoji
    image: null
    description:
      en: Emoji
      nl: Emoji
    type: translatable_category
    referencedCategoryId: null
    schema: null
  - id: attribute-3
    slug: calories
    question:
      en: How much energy per 100 g (kcal)?
      nl: Hoeveel energie per 100 g (kcal)?
    name:
      en: Calories
      nl: Calorieën
    image: null
    description:
      en: Energy per 100 g in kcal
      nl: Energie per 100 g in kcal
    type: number
    referencedCategoryId: null
    schema: null
  - id: attribute-4
    slug: averagePrice
    name:
      en: Average price
      nl: Gemiddelde prijs
    image: null
    description:
      en: Indicative average supermarket price per 100 g in EUR
      nl: Indicatieve gemiddelde supermarktprijs per 100 g in EUR
    type: number
    referencedCategoryId: null
    schema: null
  - id: attribute-5
    slug: carbs
    name:
      en: Carbohydrates
      nl: Koolhydraten
    image: null
    description:
      en: Carbohydrates per 100 g in grams
      nl: Koolhydraten per 100 g in gram
    type: number
    referencedCategoryId: null
    schema: null
  - id: attribute-6
    slug: protein
    name:
      en: Protein
      nl: Eiwit
    image: null
    description:
      en: Protein per 100 g in grams
      nl: Eiwit per 100 g in gram
    type: number
    referencedCategoryId: null
    schema: null
  - id: attribute-7
    slug: fat
    name:
      en: Fat
      nl: Vet
    image: null
    description:
      en: Fat per 100 g in grams
      nl: Vet per 100 g in gram
    type: number
    referencedCategoryId: null
    schema: null
  - id: attribute-8
    slug: fiber
    name:
      en: Fiber
      nl: Vezels
    image: null
    description:
      en: Fiber per 100 g in grams
      nl: Vezels per 100 g in gram
    type: number
    referencedCategoryId: null
    schema: null
  - id: attribute-9
    slug: countryOfOrigin
    question:
      en: Which country does this food come from?
      nl: Uit welk land komt dit voedsel?
    name:
      en: Country of origin
      nl: Land van oorsprong
    image: null
    description:
      en: Representative country associated with the food for demo purposes
      nl: Representatief land dat voor demodoeleinden met het voedsel wordt geassocieerd
    type: item_reference
    referencedCategoryId: category-1
    schema: null
  - id: attribute-10
    slug: population
    question:
      en: How many people live here?
      nl: Hoeveel mensen wonen hier?
    name:
      en: Population
      nl: Bevolking
    image: null
    description:
      en: Population count
      nl: Aantal inwoners
    type: number
    referencedCategoryId: null
    schema: null
  - id: attribute-11
    slug: continent
    name:
      en: Continent
      nl: Continent
    image: null
    description:
      en: Continent the country belongs to
      nl: Continent waartoe het land behoort
    type: translatable
    referencedCategoryId: null
    schema: null
  - id: attribute-12
    slug: center
    name:
      en: Center
      nl: Middelpunt
    image: null
    description:
      en: Map center formatted as longitude, latitude
      nl: Kaartmiddelpunt geformatteerd als lengtegraad, breedtegraad
    type: custom
    referencedCategoryId: null
    schema:
      type: array
      prefixItems:
        - type: number
        - type: number
      minItems: 2
      maxItems: 2
  - id: attribute-13
    slug: color
    name:
      en: Color
      nl: Kleur
    image: null
    description:
      en: CSS color used to fill this item on a map
      nl: CSS-kleur waarmee dit item op een kaart wordt gevuld
    type: custom
    referencedCategoryId: null
    schema:
      type: string
      minLength: 1
      maxLength: 128
  - id: attribute-14
    slug: shape
    name:
      en: Shape
      nl: Vorm
    image: null
    description:
      en: Geometry and map metadata used to visualize this item
      nl: Geometrie en kaartmetadata om dit item te visualiseren
    type: custom
    referencedCategoryId: null
    schema:
      oneOf:
        - type: object
          required:
            - ref
          properties:
            ref:
              type: string
              minLength: 1
          additionalProperties: false
        - type: object
          required:
            - geometry
          properties:
            geometry:
              type: object
              required:
                - type
                - coordinates
              properties:
                type:
                  enum:
                    - Polygon
                    - MultiPolygon
                coordinates:
                  type: array
                  minItems: 1
              additionalProperties: false
          additionalProperties: false
  - id: attribute-15
    slug: icons
    name:
      en: Icons
    image: null
    description:
      en: Map icons
    type: custom
    referencedCategoryId: null
    schema:
      type: array
      items:
        type: string
        maxLength: 32
      maxItems: 12
