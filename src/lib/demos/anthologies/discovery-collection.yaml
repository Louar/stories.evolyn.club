                opacity: 0.25
              animate:
                y: [80, 160, 80]
                scale: [1, 1.15, 1]
    announcements:
      - id: welcome
        name: Expedition briefing
        title:
          en: From the atlas to your plate
          nl: Van de atlas naar je bord
        message:
          en:
            Explore five challenges using real taxonomy data. Locate countries, compare populations, trace
            food origins, compare nutrition, and classify foods on the Wheel of Five. Each stage has
            five rounds; three correct answers unlock the next stage.
          nl:
            Ontdek vijf uitdagingen met taxonomiegegevens. Vind landen, vergelijk bevolkingen, ontdek de
            herkomst en voedingswaarde van voedsel en oefen met de Schijf van Vijf. Drie goede
            antwoorden openen de volgende fase.
      - id: retry
        name: Field notes
        title:
          en: Keep exploring
          nl: Blijf ontdekken
        message:
          en: You did not reach three correct rounds in this stage. Review the answers and start the
            expedition again. The next draft will bring a fresh selection.
          nl:
            Je behaalde geen drie goede rondes in deze fase. Bekijk de antwoorden en begin opnieuw met een
            nieuwe selectie.
      - id: complete
        name: Expedition complete
        title:
          en: Expedition complete
          nl: Expeditie voltooid
        message:
          en:
            You connected geography, food origins, nutrition, and food groups. These demo values are
            educational examples, not dietary advice; food origins are representative associations.
          nl:
            Je hebt geografie, herkomst, voedingswaarden en voedselgroepen verkend. Deze demogegevens zijn
            educatieve voorbeelden, geen voedingsadvies.
