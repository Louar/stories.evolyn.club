  - slug: world-food-expedition
    name:
      en: World Food Expedition
      nl: Wereldvoedselexpeditie
    isPublished: true
    isPublic: true
    defaultBackgroundColor: '#101b2b'
    configuration: null
    videos: []
    quizzes: []
    animations:
      - id: atlas-motion
        name: Atlas orbit
        texts: null
